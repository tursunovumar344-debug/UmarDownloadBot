<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdurazzoq Somsa</title>

<style>
:root{
 --bg:#07111b;
 --panel:#0d1c29;
 --card:#122536;
 --line:#29465c;
 --gold:#ffc83d;
 --green:#16b875;
 --blue:#1687ff;
 --red:#e84667;
 --text:#f7f9fb;
 --muted:#9dafbf;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:active{transform:scale(.97)}

.header{
 position:sticky;
 top:0;
 z-index:50;
 background:#08131ef5;
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);
 padding:12px 16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:48px;
 height:48px;
 border-radius:14px;
 background:linear-gradient(135deg,#ffdf63,#ff9800);
 display:grid;
 place-items:center;
 font-size:28px;
}
.brand h1{font-size:21px;color:var(--gold)}
.brand p{font-size:11px;color:var(--muted);margin-top:3px}

.settings{
 background:#122638;
 color:white;
 border:1px solid var(--gold);
 border-radius:11px;
 padding:11px 13px;
 font-weight:bold;
}

main{
 max-width:1500px;
 margin:auto;
 padding:18px 15px 90px;
}

.page{display:none}
.page.active{display:block}

.page-title{
 font-size:25px;
 font-weight:900;
 margin-bottom:8px;
}
.sub{
 color:var(--muted);
 font-size:13px;
 margin-bottom:16px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:16px;
}
.stat{
 background:linear-gradient(145deg,var(--card),#0d1b28);
 border:1px solid var(--line);
 border-radius:15px;
 padding:14px;
}
.stat small{
 display:block;
 color:var(--muted);
 margin-bottom:6px;
}
.stat strong{font-size:20px}

.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:15px;
}

.btn{
 min-height:44px;
 padding:0 14px;
 border-radius:10px;
 font-weight:bold;
}
.blue{background:var(--blue);color:white}
.gold{background:var(--gold);color:#111}
.green{background:var(--green);color:white}
.dark{background:#1a3143;color:white;border:1px solid var(--line)}
.red{background:var(--red);color:white}

.tables{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
}

.table{
 background:linear-gradient(145deg,#122536,#0d1b28);
 border:1px solid var(--line);
 border-radius:16px;
 padding:13px;
 min-height:175px;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.table-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.table-name{
 font-size:19px;
 font-weight:900;
}
.badge{
 padding:5px 8px;
 border-radius:20px;
 font-size:10px;
 font-weight:bold;
}
.busy{background:#0e9c63}
.empty{background:var(--red)}

.table-info{
 display:grid;
 gap:6px;
 color:#dce6ee;
 font-size:13px;
}
.total{
 background:#087a52;
 border-radius:10px;
 padding:10px;
 text-align:center;
 font-weight:bold;
}
.order-btn{
 background:var(--blue);
 color:white;
 min-height:43px;
 border-radius:10px;
 font-weight:bold;
}

.card{
 background:linear-gradient(145deg,var(--card),#0d1b28);
 border:1px solid var(--line);
 border-radius:16px;
 padding:16px;
}

.tandir-grid,
.history-grid,
.menu-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.menu-grid{grid-template-columns:repeat(4,1fr)}

.menu-item{
 background:linear-gradient(145deg,var(--card),#0d1b28);
 border:1px solid var(--line);
 border-radius:15px;
 padding:15px;
}
.menu-item .emoji{font-size:28px}
.menu-item h3{margin:8px 0 5px}
.price{
 color:var(--gold);
 font-weight:900;
}

.history-item{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:14px;
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.muted{color:var(--muted)}
.small{font-size:12px}

.numbers{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin:12px 0;
}
.num{
 background:#091722;
 border-radius:10px;
 padding:10px;
 text-align:center;
}
.num small{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-bottom:4px;
}
.num b{font-size:17px}

.green-t{color:#54e1ad}
.gold-t{color:var(--gold)}
.red-t{color:#ff7d97}

.progress{
 height:8px;
 background:#091722;
 border-radius:20px;
 overflow:hidden;
}
.progress i{
 display:block;
 height:100%;
 background:linear-gradient(90deg,var(--green),var(--gold));
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:60;
 background:#08131ef5;
 border-top:1px solid var(--line);
 display:flex;
 padding:5px;
 backdrop-filter:blur(12px);
}

.nav{
 background:transparent;
 color:#9dadbc;
 min-height:56px;
 flex:1;
 font-size:11px;
 font-weight:bold;
 display:grid;
 place-items:center;
}
.nav span{font-size:20px}
.nav.active{color:var(--gold)}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#000b;
 z-index:100;
 padding:12px;
 overflow:auto;
}
.modal.show{
 display:flex;
 align-items:center;
 justify-content:center;
}

.box{
 width:min(700px,100%);
 max-height:94vh;
 overflow:auto;
 background:#0d1c29;
 border:1px solid var(--line);
 border-radius:20px;
 padding:16px;
}
.head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}
.x{
 width:42px;
 height:42px;
 border-radius:10px;
 background:#1b3041;
 color:white;
 font-size:24px;
}

.section{
 background:#112536;
 border:1px solid var(--line);
 border-radius:14px;
 padding:14px;
 margin-bottom:12px;
}
.section h3{margin-bottom:12px}

.field{margin-bottom:10px}
.field label{
 display:block;
 color:#b9c7d2;
 font-size:12px;
 margin-bottom:5px;
}
.field input,
.product-row input,
.order-add select,
.order-add input{
 width:100%;
 min-height:47px;
 background:#081621;
 border:1px solid #35546b;
 border-radius:10px;
 color:white;
 padding:0 11px;
 outline:none;
}

.save{
 width:100%;
 min-height:49px;
 border-radius:11px;
 background:var(--gold);
 color:#111;
 font-weight:900;
}

.product-row{
 display:grid;
 grid-template-columns:1fr 120px 42px;
 gap:7px;
 margin-bottom:8px;
}
.product-row button{
 border-radius:9px;
 background:#8f2942;
 color:white;
}

.add{
 width:100%;
 min-height:44px;
 border-radius:10px;
 background:#1a3a51;
 color:white;
 font-weight:bold;
}

.order-item{
 background:#132a3b;
 border:1px solid var(--line);
 border-radius:12px;
 padding:11px;
 margin-bottom:8px;
}

.order-top{
 display:flex;
 justify-content:space-between;
 gap:8px;
}
.order-name{font-weight:bold}
.order-price{
 color:var(--gold);
 font-weight:bold;
}

.controls{
 display:flex;
 align-items:center;
 gap:7px;
 margin-top:9px;
}
.qty-btn{
 width:42px;
 height:42px;
 border-radius:9px;
 background:#203d52;
 color:white;
 font-size:20px;
 font-weight:bold;
}
.qty{
 min-width:35px;
 text-align:center;
 font-size:17px;
 font-weight:bold;
}
.edit{
 margin-left:auto;
 background:#294a61;
 color:white;
 border-radius:9px;
 padding:9px 11px;
 font-size:11px;
 font-weight:bold;
}

.order-add{
 display:grid;
 grid-template-columns:1fr 85px;
 gap:8px;
}
.order-add button{
 grid-column:1/-1;
 min-height:47px;
 border-radius:10px;
 background:var(--blue);
 color:white;
 font-weight:bold;
}

.big-total{
 background:#087a52;
 border-radius:13px;
 text-align:center;
 padding:15px;
 margin:12px 0;
}
.big-total small{
 display:block;
 color:#d4fff0;
}
.big-total strong{font-size:26px}

.close-order{
 width:100%;
 min-height:52px;
 border-radius:11px;
 background:var(--green);
 color:white;
 font-weight:900;
}

.empty-state{
 text-align:center;
 color:var(--muted);
 padding:30px 10px;
 background:#0d1c29;
 border:1px dashed var(--line);
 border-radius:14px;
}

.toast{
 position:fixed;
 z-index:300;
 left:50%;
 bottom:80px;
 transform:translate(-50%,20px);
 background:#172c3e;
 border:1px solid #4b667d;
 color:white;
 padding:11px 15px;
 border-radius:10px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 max-width:90%;
 text-align:center;
}
.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

@media(max-width:1150px){
 .tables{grid-template-columns:repeat(4,1fr)}
 .menu-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
 .brand h1{font-size:18px}
 .brand p{display:none}
 .stats{grid-template-columns:repeat(2,1fr)}
 .tables{grid-template-columns:repeat(2,1fr)}
 .tandir-grid,.history-grid{grid-template-columns:repeat(2,1fr)}
 .menu-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:450px){
 .brand h1{font-size:15px}
 .logo{width:42px;height:42px;font-size:24px}
 .settings{padding:10px;font-size:11px}
 .tables{gap:8px}
 .table{min-height:170px;padding:10px}
 .table-name{font-size:16px}
 .tandir-grid,.history-grid,.menu-grid{grid-template-columns:1fr}
 .product-row{grid-template-columns:1fr 100px 40px}
}
</style>
</head>

<body>

<header class="header">
 <div class="brand">
  <div class="logo">🥟</div>
  <div>
   <h1>ABDURAZZOQ SOMSA</h1>
   <p>Stol • Tandir • Menyu • Hisobot</p>
  </div>
 </div>

 <button class="settings" onclick="openSettings()">⚙️ Sozlamalar</button>
</header>

<main>

<section id="home" class="page active"></section>

<section id="tablesPage" class="page"></section>

<section id="tandirPage" class="page"></section>

<section id="menuPage" class="page"></section>

<section id="reportPage" class="page"></section>

</main>

<nav class="bottom">
 <button class="nav active" data-page="home" onclick="go('home')">
  <span>🏠</span>Asosiy
 </button>

 <button class="nav" data-page="tablesPage" onclick="go('tablesPage')">
  <span>🪑</span>Stollar
 </button>

 <button class="nav" data-page="tandirPage" onclick="go('tandirPage')">
  <span>🔥</span>Tandirlar
 </button>

 <button class="nav" data-page="menuPage" onclick="go('menuPage')">
  <span>🍽️</span>Menyu
 </button>

 <button class="nav" data-page="reportPage" onclick="go('reportPage')">
  <span>📊</span>Hisobot
 </button>
</nav>


<!-- SOZLAMALAR -->

<div id="settingsModal" class="modal">
<div class="box">

 <div class="head">
  <h2>⚙️ Sozlamalar</h2>
  <button class="x" onclick="closeModal('settingsModal')">×</button>
 </div>

 <div class="section">
  <h3>🪑 Stol soni</h3>

  <div class="field">
   <label>Nechta stol bor?</label>
   <input id="tableCount" type="number" min="1" max="100">
  </div>

  <button class="save" onclick="saveTableCount()">
   💾 Stol sonini saqlash
  </button>
 </div>

 <div class="section">
  <h3>💰 Mahsulotlar va narxlar</h3>

  <div id="productFields"></div>

  <button class="add" onclick="addProductField()">
   ➕ Yangi mahsulot
  </button>

  <br><br>

  <button class="save" onclick="saveProducts()">
   💾 Mahsulotlarni saqlash
  </button>
 </div>

 <div class="section">
  <h3>🗑️ Ma'lumotlar</h3>

  <button class="btn red" style="width:100%" onclick="resetAll()">
   Barcha ma'lumotlarni tozalash
  </button>
 </div>

</div>
</div>


<!-- STOL ZAKAZI -->

<div id="orderModal" class="modal">
<div class="box">

 <div class="head">
  <h2 id="orderTitle"></h2>
  <button class="x" onclick="closeModal('orderModal')">×</button>
 </div>

 <div class="section">

  <h3>➕ Zakaz qo‘shish</h3>

  <div class="order-add">

   <select id="orderProduct"></select>

   <input
    id="orderQty"
    type="number"
    min="1"
    value="1"
    inputmode="numeric"
   >

   <button onclick="addOrder()">➕ Qo‘shish</button>

  </div>

 </div>

 <div class="section">

  <h3>📋 Stol zakazi</h3>

  <div id="orderItems"></div>

  <div class="big-total">
   <small>Jami hisob</small>
   <strong id="orderTotal">0 so‘m</strong>
  </div>

  <button class="close-order" onclick="closeOrder()">
   ✅ Hisobni yopish
  </button>

 </div>

</div>
</div>


<!-- TANDIR -->

<div id="tandirModal" class="modal">
<div class="box">

 <div class="head">
  <h2>🔥 Yangi tandir</h2>
  <button class="x" onclick="closeModal('tandirModal')">×</button>
 </div>

 <div class="section">

  <div class="field">
   <label>Mol go‘shtli somsa — nechta yopildi?</label>
   <input id="beefBaked" type="number" min="0" value="0">
  </div>

  <div class="field">
   <label>Qo‘y go‘shtli somsa — nechta yopildi?</label>
   <input id="muttonBaked" type="number" min="0" value="0">
  </div>

  <button class="save" onclick="createTandir()">
   🔥 Tandirni ochish
  </button>

 </div>

</div>
</div>

<div id="toast" class="toast"></div>


<script>

/* =========================
   MA'LUMOTLAR
========================= */

const KEY = "abdurazzoq_somsa_daily_v2";

const defaults = [

 {
  id:1,
  name:"Mol go‘shtli somsa",
  price:10000,
  type:"beef",
  emoji:"🥟",
  isSomsa:true
 },

 {
  id:2,
  name:"Qo‘y go‘shtli somsa",
  price:10000,
  type:"mutton",
  emoji:"🥟",
  isSomsa:true
 },

 {
  id:3,
  name:"Maydacha somsa",
  price:8000,
  type:"mayda",
  emoji:"🥟",
  isSomsa:true
 },

 {
  id:4,
  name:"Coca-Cola",
  price:12000,
  type:"drink",
  emoji:"🥤",
  isSomsa:false
 },

 {
  id:5,
  name:"Fanta",
  price:12000,
  type:"drink",
  emoji:"🥤",
  isSomsa:false
 },

 {
  id:6,
  name:"Choy",
  price:5000,
  type:"drink",
  emoji:"🫖",
  isSomsa:false
 }

];


let db = load();
let currentTable = null;


/* =========================
   SAQLASH
========================= */

function load(){

 try{

  const x = JSON.parse(
   localStorage.getItem(KEY)
  );

  if(x){

   if(!x.dailyReports)
    x.dailyReports = {};

   return x;
  }

 }catch(e){}

 return {

  tableCount:20,

  products:defaults,

  tables:{},

  tandirs:[],

  history:[],

  dailyReports:{}

 };

}


function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

}


/* =========================
   YORDAMCHI
========================= */

function money(n){

 return Number(n || 0)
  .toLocaleString("uz-UZ")
  .replace(/,/g," ")
  + " so‘m";

}


function todayKey(){

 const d = new Date();

 const y = d.getFullYear();

 const m = String(
  d.getMonth()+1
 ).padStart(2,"0");

 const day = String(
  d.getDate()
 ).padStart(2,"0");

 return `${y}-${m}-${day}`;

}


function niceDate(key){

 const [y,m,d] = key.split("-");

 return `${d}.${m}.${y}`;

}


function dateText(d=new Date()){

 return d.toLocaleString(
  "uz-UZ",
  {
   day:"2-digit",
   month:"2-digit",
   year:"numeric",
   hour:"2-digit",
   minute:"2-digit"
  }
 );

}


function toast(text){

 const el =
  document.getElementById("toast");

 el.textContent = text;

 el.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer =
  setTimeout(
   ()=>el.classList.remove("show"),
   2200
  );

}


function closeModal(id){

 document
  .getElementById(id)
  .classList.remove("show");

}


function table(n){

 if(!db.tables[n])
  db.tables[n] = {
   orders:[]
  };

 return db.tables[n];

}


function total(n){

 return table(n)
  .orders
  .reduce(
   (s,o)=>s + o.price*o.qty,
   0
  );

}


function activeTandir(){

 return db.tandirs.find(
  t=>t.status==="active"
 ) || null;

}


function tandirRemain(type){

 const t = activeTandir();

 if(!t) return 0;

 return Math.max(
  0,
  (t[type+"Baked"] || 0) -
  (t[type+"Sold"] || 0)
 );

}


function somsaQty(n){

 return table(n)
  .orders
  .reduce(
   (s,o)=>
    s+(o.isSomsa ? o.qty : 0),
   0
  );

}


function product(id){

 return db.products.find(
  p=>String(p.id)===String(id)
 );

}


/* =========================
   KUNLIK HISOBOT
========================= */

function createDailyReport(){

 const key = todayKey();

 if(!db.dailyReports[key]){

  db.dailyReports[key] = {

   date:key,

   revenue:0,

   bills:0,

   products:{},

   tables:[]

  };

 }

 return db.dailyReports[key];

}


function addToDailyReport(record){

 const report =
  createDailyReport();

 report.revenue += record.total;

 report.bills += 1;

 report.tables.push({
  table:record.table,
  total:record.total,
  time:record.date
 });

 record.orders.forEach(o=>{

  if(!report.products[o.productId]){

   report.products[o.productId] = {

    name:o.name,

    qty:0,

    total:0,

    type:o.type || ""

   };

  }

  report.products[o.productId].qty += o.qty;

  report.products[o.productId].total +=
   o.qty * o.price;

 });

 save();

}


/* =========================
   NAVIGATSIYA
========================= */

function go(id){

 document
  .querySelectorAll(".page")
  .forEach(
   x=>x.classList.remove("active")
  );

 document
  .getElementById(id)
  .classList.add("active");

 document
  .querySelectorAll(".nav")
  .forEach(
   x=>x.classList.toggle(
    "active",
    x.dataset.page===id
   )
  );

 renderAll();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* =========================
   HAMMASINI CHIZISH
========================= */

function renderAll(){

 renderHome();

 renderTables();

 renderTandir();

 renderMenu();

 renderReport();

}


/* =========================
   ASOSIY
========================= */

function renderHome(){

 const activeTables =
  Object.keys(db.tables)
  .filter(
   k=>table(k).orders.length
  ).length;

 const report =
  db.dailyReports[todayKey()] ||
  {
   revenue:0,
   bills:0
  };

 document.getElementById("home")
 .innerHTML = `

 <div class="page-title">
  🏠 Abdurazzoq Somsa
 </div>

 <div class="sub">
  Bugungi savdo va boshqaruv.
 </div>

 <div class="stats">

  <div class="stat">
   <small>Band stollar</small>
   <strong>${activeTables}</strong>
  </div>

  <div class="stat">
   <small>Stollar jami</small>
   <strong>${db.tableCount}</strong>
  </div>

  <div class="stat">
   <small>Bugungi tushum</small>
   <strong>${money(report.revenue)}</strong>
  </div>

  <div class="stat">
   <small>Bugungi hisoblar</small>
   <strong>${report.bills}</strong>
  </div>

 </div>

 <div class="toolbar">

  <button
   class="btn blue"
   onclick="go('tablesPage')">
   🪑 Stol zakazlari
  </button>

  <button
   class="btn gold"
   onclick="openTandir()">
   🔥 Yangi tandir
  </button>

  <button
   class="btn dark"
   onclick="go('reportPage')">
   📊 Bugungi hisobot
  </button>

 </div>

 <div class="card">

  <h3>📅 Bugun</h3>

  <p
   class="muted"
   style="margin-top:10px;line-height:1.6">

   ${niceDate(todayKey())} kuni yopilgan
   barcha stollar avtomatik ravishda
   bugungi hisobotga qo‘shiladi.

  </p>

 </div>
 `;

}


/* =========================
   STOLLAR
========================= */

function renderTables(){

 const el =
  document.getElementById(
   "tablesPage"
  );

 let html = `

 <div class="page-title">
  🪑 Stollar
 </div>

 <div class="sub">

}


function fillOrderProducts(){

 const select =
  document.getElementById(
   "orderProduct"
  );

 select.innerHTML = "";

 db.products.forEach(p=>{

  const option =
   document.createElement("option");

  option.value = p.id;

  option.textContent =

  select.appendChild(option);

 });

}


function renderOrderItems(){

 const box =
  document.getElementById(
   "orderItems"
  );

 const t = table(currentTable);

 if(!t.orders.length){

  box.innerHTML = `
   <div class="empty-state">
    Hali zakaz yo‘q.
   </div>
  `;

 }else{

  box.innerHTML =
   t.orders.map((o,i)=>`

   <div class="order-item">

    <div class="order-top">

     <div class="order-name">
      ${o.emoji || "•"}
      ${o.name}
     </div>

     <div class="order-price">

     </div>

      −
     </button>

      ${o.qty}
     </div>

     <button
      class="qty-btn"
      onclick="changeQty(${i},1)">
      +

     </button>

    </div>

   </div>

  `).join("");

 }

 document
  .getElementById("orderTotal")
  .textContent =
   money(total(currentTable));

}


function addOrder(){

 const p =
  product(
   document.getElementById(
    "orderProduct"
   ).value
  );

 const q =
  Math.floor(
   Number(
    document.getElementById(
     "orderQty"
    ).value
   )
  );

 if(!p || q<1){

  toast(
   "Miqdorni to‘g‘ri kiriting."
  );

  return;
 }


 if(p.isSomsa){

  const t =
   activeTandir();

  if(!t){

   toast(
    "Avval faol tandir oching."
   );

   return;
  }

  const left =
   tandirRemain(p.type);

  if(q>left){

   toast(
    `Tandirda faqat ${left} ta qoldi.`
   );

   return;
  }

 }


 const t =
  table(currentTable);

 const old =
  t.orders.find(
   o=>o.productId===p.id
  );


 if(old){

  old.qty += q;

 }else{

  t.orders.push({

   productId:p.id,

   name:p.name,

   price:p.price,

   qty:q,

   isSomsa:p.isSomsa,

   type:p.type || "",

   emoji:p.emoji || "🍽️"

  });

 }


 if(p.isSomsa){

  const at =
   activeTandir();

  at[p.type+"Sold"] += q;

 }


 save();

 renderOrderItems();

 renderAll();

 document
  .getElementById("orderQty")
  .value=1;

 toast(
  `${q} ta ${p.name} qo‘shildi`
 );

}


function changeQty(i,d){

 const t =
  table(currentTable);

 const o =
  t.orders[i];


 if(d>0 && o.isSomsa){

  const at =
   activeTandir();

  if(!at){

   toast(
    "Faol tandir yo‘q."
   );

   return;
  }

  if(
   tandirRemain(o.type)<1
  ){

   toast(
    "Tandirda somsa qolmagan."
   );

   return;
  }

  at[o.type+"Sold"]++;

 }


 if(
  d<0 &&
  o.isSomsa &&
  activeTandir()
 ){

  const at =
   activeTandir();

  at[o.type+"Sold"] =
   Math.max(
    0,
    at[o.type+"Sold"]-1
   );

 }


 o.qty += d;


 if(o.qty<=0){

  t.orders.splice(i,1);

 }


 save();

 renderOrderItems();

 renderAll();

}


function editQty(i){

 const t =
  table(currentTable);

 const o =
  t.orders[i];

 const n =
  Number(
   prompt(
    `${o.name} nechta bo‘lsin?`,
    o.qty
   )
  );

 if(
  !Number.isInteger(n) ||
  n<1
 ) return;


 const diff =
  n-o.qty;


 if(o.isSomsa){

  const at =
   activeTandir();

  if(!at){

   toast(
    "Faol tandir yo‘q."
   );

   return;
  }


  if(
   diff>0 &&
   tandirRemain(o.type)<diff
  ){

   toast(
    `Faqat ${tandirRemain(o.type)} ta qoldi.`
   );

   return;
  }


  at[o.type+"Sold"] =
   Math.max(
    0,
    at[o.type+"Sold"] + diff
   );

 }


 o.qty=n;

 save();

 renderOrderItems();

 renderAll();

}


/* =========================
   HISOBNI YOPISH
========================= */

function closeOrder(){

 const t =
  table(currentTable);

 if(!t.orders.length){

  closeModal("orderModal");

  return;
 }


 const sum =
  total(currentTable);


 if(!confirm(
  `${currentTable}-stol hisobi ${money(sum)}.\n\nHisobni yopasizmi?`
 )) return;


 const record = {

  table:currentTable,

  total:sum,

  orders:
   JSON.parse(
    JSON.stringify(t.orders)
   ),

  date:
   new Date().toISOString()

 };


 /* umumiy tarix */

 db.history.push(record);


 /* KUNLIK HISOBOTGA QO‘SHISH */

 addToDailyReport(record);


 /* stolni bo‘shatish */

 t.orders=[];


 save();

 closeModal("orderModal");

 renderAll();

 toast(
  "Hisob yopildi va kunlik hisobotga saqlandi."
 );

}

function openTandir(){

 if(activeTandir()){

  toast(
   "Avval hozirgi tandirni tugating."
  );

  return;
 }

 document
  .getElementById("beefBaked")
  .value=0;

 document
  .getElementById("muttonBaked")
  .value=0;

 document
  .getElementById("tandirModal")
  .classList.add("show");

}


function createTandir(){

 const b =
  Math.floor(
   Number(
    document.getElementById(
     "beefBaked"
    ).value
   ) || 0
  );

 const m =
  Math.floor(
   Number(
    document.getElementById(
     "muttonBaked"
    ).value
   ) || 0
  );


 if(b+m<1){

  toast(
   "Kamida bitta somsa kiriting."
  );

  return;
 }


 db.tandirs.push({

  id:Date.now(),

  name:
   `${db.tandirs.length+1}-tandir`,

  beefBaked:b,

  muttonBaked:m,

  beefSold:0,

  muttonSold:0,

  status:"active",

  openedAt:
   new Date().toISOString()

 });


 save();

 closeModal("tandirModal");

 renderAll();

 toast(
  "Yangi tandir ochildi."
 );

}


function finishTandir(){

 const t =
  activeTandir();

 if(!t) return;


 if(
  Object.keys(db.tables)
  .some(
   k=>table(k).orders.length
  )
 ){

  toast(
   "Avval faol stol hisoblarini yoping."
  );

  return;
 }


 if(!confirm(
  `${t.name}ni tugatasizmi?`
 )) return;


 t.status="closed";

 t.closedAt =
  new Date().toISOString();

 save();

 renderAll();

 toast(
  "Tandir tugatildi."
 );

}

 db.products.splice(i,1);

function saveProducts(){

  [...document.querySelectorAll(
   ".pname"
  )];

  [...document.querySelectorAll(
   ".pprice"
  )];


 names.forEach((e,i)=>{

    Number(prices[i].value)||0
   );

 );

  "Mahsulotlar saqlandi."
 );

 if(n<1 || n>100){

 closeModal(
  "settingsModal"
 );

  `${n} ta stol saqlandi.`
 );

}


function resetAll(){

 if(!confirm(
  "Barcha stollar, tandirlar va kunlik hisobotlar o‘chadi. Davom etasizmi?"
 )) return;

 localStorage.removeItem(KEY);

 location.reload();

}


function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  m=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"

  }[m])
 );

}
