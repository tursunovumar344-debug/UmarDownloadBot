<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdurazzoq somsa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #8b0000, #c0392b);
    color: white;
    padding: 25px 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 29px;
}

.header p {
    margin: 7px 0 0;
    opacity: .9;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    color: #8b0000;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.menu-item {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 14px;
}

.menu-item strong {
    display: block;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 15px;
    background: white;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    font-size: 15px;
    cursor: pointer;
}

.save-menu {
    background: #8b0000;
    color: white;
    margin-top: 12px;
}

.tandir {
    border: 2px solid #eee;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
}

.tandir-title {
    font-size: 20px;
    font-weight: bold;
    color: #8b0000;
    margin-bottom: 12px;
}

.batch {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
}

.batch-total {
    font-weight: bold;
    white-space: nowrap;
}

.remove-batch {
    background: #e74c3c;
    color: white;
}

.add-batch {
    background: #27ae60;
    color: white;
    margin-top: 5px;
}

.tandir-summary {
    background: #fff4e6;
    color: #8b0000;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    font-weight: bold;
    font-size: 17px;
}

.expense-row {
    display: grid;
    grid-template-columns: 1fr 180px auto;
    gap: 10px;
    margin-bottom: 10px;
}

.add-expense {
    background: #2980b9;
    color: white;
}

.remove-expense {
    background: #e74c3c;
    color: white;
}

.expense-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 5px;
    border-bottom: 1px solid #eee;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}

.summary-box {
    background: white;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.summary-box span {
    display: block;
    color: #666;
    font-size: 14px;
    margin-bottom: 8px;
}

.summary-box strong {
    font-size: 20px;
}

.save-day {
    width: 100%;
    background: #8b0000;
    color: white;
    font-size: 17px;
    padding: 15px;
}

.history select {
    margin-bottom: 15px;
}

.history-result {
    background: #f8f8f8;
    border-radius: 12px;
    padding: 15px;
}

.history-tandir {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.history-expense {
    padding: 7px 0;
}

@media (max-width:700px) {

    .menu-grid {
        grid-template-columns: 1fr;
    }

    .summary {
        grid-template-columns: 1fr 1fr;
    }

    .batch {
        grid-template-columns: 1fr 1fr;
    }

    .batch-total {
        grid-column: 1 / 2;
    }

    .remove-batch {
        grid-column: 2 / 3;
    }

    .expense-row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🥟 Abdurazzoq somsa</h1>
    <p>Kunlik hisob-kitob tizimi</p>
</div>

<div class="container">

<!-- MENU -->

<div class="card">

<h2>🍽️ Menyu va narxlar</h2>

<div class="menu-grid">

<div class="menu-item">
<strong>🥟 Qo‘y go‘shtli somsa</strong>
<input
type="number"
id="qoyPrice"
placeholder="Narxini kiriting">
</div>

<div class="menu-item">
<strong>🥟 Mol go‘shtli somsa</strong>
<input
type="number"
id="molPrice"
placeholder="Narxini kiriting">
</div>

<div class="menu-item">
<strong>🥟 Mayda somsa</strong>
<input
type="number"
id="maydaPrice"
placeholder="Narxini kiriting">
</div>

</div>

<button class="save-menu" onclick="saveMenu()">
💾 Menyu narxlarini saqlash
</button>

</div>


<!-- SANA -->

<div class="card">

<h2>📅 Ish kuni</h2>

<input type="date" id="workDate">

</div>


<!-- TANDIRLAR -->

<div class="card">

<h2>🔥 10 ta tandir hisoboti</h2>

<div id="tandirs"></div>

</div>


<!-- XARAJATLAR -->

<div class="card">

<h2>💸 Xarajatlar</h2>

<div class="expense-row">

<input
type="text"
id="expenseName"
placeholder="Masalan: Go‘sht">

<input
type="number"
id="expenseAmount"
placeholder="Summa">

<button
class="add-expense"
onclick="addExpense()">
+ Qo‘shish
</button>

</div>

<div id="expenseList"></div>

</div>


<!-- UMUMIY HISOB -->

<div class="card">

<h2>📊 Bugungi hisob</h2>

<div class="summary">

<div class="summary-box">
<span>Jami somsa</span>
<strong id="totalCount">0 dona</strong>
</div>

<div class="summary-box">
<span>Jami tushum</span>
<strong id="totalRevenue">0 so‘m</strong>
</div>

<div class="summary-box">
<span>Jami xarajat</span>
<strong id="totalExpense">0 so‘m</strong>
</div>

<div class="summary-box">
<span>Sof foyda</span>
<strong id="netProfit">0 so‘m</strong>
</div>

</div>

</div>


<!-- SAQLASH -->

<div class="card">

<button
class="save-day"
onclick="saveDay()">

💾 Bugungi hisobni saqlash

</button>

</div>


<!-- TARIX -->

<div class="card history">

<h2>📚 Tarix</h2>

<select
id="historyDate"
onchange="showHistory()">

<option value="">
Sanani tanlang
</option>

</select>

<div id="historyResult"></div>

</div>

</div>


<script>

const MENU_KEY = "abdurazzoq_menu";
const HISTORY_KEY = "abdurazzoq_history";

let menu =
JSON.parse(localStorage.getItem(MENU_KEY)) || {
qoy: 0,
mol: 0,
mayda: 0
};

let expenses = [];


// =====================
// MENU
// =====================

function loadMenu() {

document.getElementById("qoyPrice").value =
menu.qoy || "";

document.getElementById("molPrice").value =
menu.mol || "";

document.getElementById("maydaPrice").value =
menu.mayda || "";

}


function saveMenu() {

menu = {

qoy:
Number(document.getElementById("qoyPrice").value) || 0,

mol:
Number(document.getElementById("molPrice").value) || 0,

mayda:
Number(document.getElementById("maydaPrice").value) || 0

};

localStorage.setItem(
MENU_KEY,
JSON.stringify(menu)
);

calculateTotal();

alert("Menyu narxlari saqlandi ✅");

}


// =====================
// TANDIRLAR
// =====================

function renderTandirs() {

const container =
document.getElementById("tandirs");

container.innerHTML = "";

for(let i = 1; i <= 10; i++) {

const tandir =
document.createElement("div");

tandir.className = "tandir";

tandir.innerHTML = `

<div class="tandir-title">
🔥 ${i}-tandir
</div>

<div id="batches${i}"></div>

<div class="tandir-summary">
🥟 Bu tandirda jami:
<span id="tandirCount${i}">0</span>
dona somsa yopildi
</div>

<button
class="add-batch"
onclick="addBatch(${i})">

+ Yana somsa qo‘shish

</button>

`;

container.appendChild(tandir);

addBatch(i);

}

}


// =====================
// YANGI SOMSA QO‘SHISH
// =====================

function addBatch(tandirNumber) {

const container =
document.getElementById(
"batches" + tandirNumber
);

const row =
document.createElement("div");

row.className = "batch";

row.innerHTML = `

<select onchange="calculateTotal()">

<option value="qoy">
Qo‘y go‘shtli somsa
</option>

<option value="mol">
Mol go‘shtli somsa
</option>

<option value="mayda">
Mayda somsa
</option>

</select>

<input
type="number"
min="0"
placeholder="Nechta somsa?"
oninput="calculateTotal()">

<div class="batch-total">
0 so‘m
</div>

<button
class="remove-batch"
onclick="removeBatch(this)">

🗑️

</button>

`;

container.appendChild(row);

calculateTotal();

}


// =====================
// O‘CHIRISH
// =====================

function removeBatch(button) {

const row =
button.parentElement;

const parent =
row.parentElement;

if(parent.children.length <= 1) {

alert(
"Tandirda kamida bitta qator qolishi kerak."
);

return;

}

row.remove();

calculateTotal();

}


// =====================
// NARX
// =====================

function getPrice(type) {

if(type === "qoy")
return menu.qoy;

if(type === "mol")
return menu.mol;

if(type === "mayda")
return menu.mayda;

return 0;

}


// =====================
// ASOSIY HISOB
// =====================

function calculateTotal() {

let totalCount = 0;
let totalRevenue = 0;

for(let i = 1; i <= 10; i++) {

const container =
document.getElementById(
"batches" + i
);

if(!container) continue;

const rows =
container.querySelectorAll(".batch");

let tandirCount = 0;

rows.forEach(row => {

const type =
row.querySelector("select").value;

const count =
Number(
row.querySelector("input").value
) || 0;

const price =
getPrice(type);

const total =
count * price;

row.querySelector(
".batch-total"
).textContent =
formatMoney(total) + " so‘m";

tandirCount += count;

totalCount += count;

totalRevenue += total;

});

const counter =
document.getElementById(
"tandirCount" + i
);

if(counter) {

counter.textContent =
tandirCount.toLocaleString("uz-UZ");

}

}


let totalExpense = 0;

expenses.forEach(expense => {

totalExpense +=
Number(expense.amount) || 0;

});


const profit =
totalRevenue - totalExpense;


document.getElementById(
"totalCount"
).textContent =
totalCount.toLocaleString("uz-UZ")
+ " dona";


document.getElementById(
"totalRevenue"
).textContent =
formatMoney(totalRevenue)
+ " so‘m";


document.getElementById(
"totalExpense"
).textContent =
formatMoney(totalExpense)
+ " so‘m";


document.getElementById(
"netProfit"
).textContent =
formatMoney(profit)
+ " so‘m";

}


// =====================
// XARAJATLAR
// =====================

function addExpense() {

const name =
document.getElementById(
"expenseName"
).value.trim();

const amount =
Number(
document.getElementById(
"expenseAmount"
).value
);

if(!name) {

alert("Xarajat nomini kiriting.");

return;

}

if(!amount || amount <= 0) {

alert("Xarajat summasini kiriting.");

return;

}

expenses.push({

name: name,

amount: amount

});

document.getElementById(
"expenseName"
).value = "";

document.getElementById(
"expenseAmount"
).value = "";

renderExpenses();

calculateTotal();

}


function renderExpenses() {

const list =
document.getElementById(
"expenseList"
);

list.innerHTML = "";

expenses.forEach((expense,index) => {

const item =
document.createElement("div");

item.className =
"expense-item";

item.innerHTML = `

<div>

<strong>
${escapeHtml(expense.name)}
</strong>

<br>

${formatMoney(expense.amount)}
so‘m

</div>

<button
class="remove-expense"
onclick="removeExpense(${index})">

🗑️

</button>

`;

list.appendChild(item);

});

}


function removeExpense(index) {

expenses.splice(index,1);

renderExpenses();

calculateTotal();

}


// =====================
// SAQLASH
// =====================

function saveDay() {

const date =
document.getElementById(
"workDate"
).value;

if(!date) {

alert("Avval sanani tanlang.");

return;

}

const tandirs = [];

for(let i = 1; i <= 10; i++) {

const container =
document.getElementById(
"batches" + i
);

const rows =
container.querySelectorAll(".batch");

const batches = [];

rows.forEach(row => {

const type =
row.querySelector("select").value;

const count =
Number(
row.querySelector("input").value
) || 0;

if(count > 0) {

const price =
getPrice(type);

batches.push({

type: type,

count: count,

price: price,

total: count * price

});

}

});

tandirs.push({

tandir: i,

batches: batches

});

}


const history =
JSON.parse(
localStorage.getItem(HISTORY_KEY)
) || {};


history[date] = {

tandirs: tandirs,

expenses: expenses,

savedAt:
new Date().toISOString()

};


localStorage.setItem(
HISTORY_KEY,
JSON.stringify(history)
);

loadHistoryDates();

document.getElementById(
"historyDate"
).value = date;

showHistory();

alert(
"Bugungi hisob muvaffaqiyatli saqlandi ✅"
);

}


// =====================
// TARIX SANALARI
// =====================

function loadHistoryDates() {

const select =
document.getElementById(
"historyDate"
);

const history =
JSON.parse(
localStorage.getItem(HISTORY_KEY)
) || {};

select.innerHTML =
`<option value="">
Sanani tanlang
</option>`;

Object.keys(history)
.sort()
.reverse()
.forEach(date => {

const option =
document.createElement("option");

option.value = date;

option.textContent = date;

select.appendChild(option);

});

}


// =====================
// TARIXNI KO‘RSATISH
// =====================

function showHistory() {

const date =
document.getElementById(
"historyDate"
).value;

const result =
document.getElementById(
"historyResult"
);

if(!date) {

result.innerHTML = "";

return;

}

const history =
JSON.parse(
localStorage.getItem(HISTORY_KEY)
) || {};

const day =
history[date];

if(!day) {

result.innerHTML =
"<p>Bu sana uchun ma'lumot topilmadi.</p>";

return;

}

let totalCount = 0;
let totalRevenue = 0;

let html = `
<h3>📅 ${date}</h3>
`;

day.tandirs.forEach(tandir => {

if(
!tandir.batches ||
tandir.batches.length === 0
) return;

let tandirCount = 0;

html += `

<div class="history-tandir">

<strong>
🔥 ${tandir.tandir}-tandir
</strong>

`;

tandir.batches.forEach(batch => {

const typeName =
getTypeName(batch.type);

tandirCount +=
Number(batch.count);

totalCount +=
Number(batch.count);

totalRevenue +=
Number(batch.total);

html += `

<div style="margin-top:8px;">

${typeName} —

<strong>
${batch.count} dona
</strong>

×

${formatMoney(batch.price)}
so‘m

=

<strong>
${formatMoney(batch.total)}
so‘m
</strong>

</div>

`;

});


html += `

<div class="tandir-summary">

🥟 Bu tandirda jami:
${tandirCount.toLocaleString("uz-UZ")}
dona somsa yopilgan

</div>

</div>

`;

});


let totalExpense = 0;

html += `
<h3>💸 Xarajatlar</h3>
`;

if(
day.expenses &&
day.expenses.length > 0
) {

day.expenses.forEach(expense => {

totalExpense +=
Number(expense.amount);

html += `

<div class="history-expense">

${escapeHtml(expense.name)}

—

<strong>

${formatMoney(expense.amount)}
so‘m

</strong>

</div>

`;

});

} else {

html +=
"<p>Xarajat kiritilmagan.</p>";

}


const profit =
totalRevenue - totalExpense;


html += `

<hr>

<p>
🥟 <strong>Jami somsa:</strong>
${totalCount.toLocaleString("uz-UZ")}
dona
</p>

<p>
💰 <strong>Jami tushum:</strong>
${formatMoney(totalRevenue)}
so‘m
</p>

<p>
💸 <strong>Jami xarajat:</strong>
${formatMoney(totalExpense)}
so‘m
</p>

<p>
📈 <strong>Sof foyda:</strong>
${formatMoney(profit)}
so‘m
</p>

`;

result.innerHTML = html;

}


// =====================
// NOMLAR
// =====================

function getTypeName(type) {

if(type === "qoy")
return "🥟 Qo‘y go‘shtli somsa";

if(type === "mol")
return "🥟 Mol go‘shtli somsa";

if(type === "mayda")
return "🥟 Mayda somsa";

return "Noma'lum";

}


// =====================
// PUL FORMAT
// =====================

function formatMoney(number) {

return Number(number || 0)
.toLocaleString("uz-UZ");

}


// =====================
// XAVFSIZ MATN
// =====================

function escapeHtml(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}


// =====================
// BOSHLASH
// =====================

document.getElementById(
"workDate"
).value =
new Date()
.toISOString()
.split("T")[0];

loadMenu();

renderTandirs();

renderExpenses();

loadHistoryDates();

calculateTotal();

</script>

</body>
</html>
