<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdurazzoq Somsa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111b;
    color:white;
    padding-bottom:80px;
}

header{
    background:#0d1c29;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #29455a;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#ffc83d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.logo h1{
    color:#ffc83d;
    font-size:20px;
}

.logo p{
    color:#9dafbf;
    font-size:11px;
    margin-top:3px;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.settings-btn{
    background:#172d40;
    color:white;
    border:1px solid #ffc83d;
    padding:12px;
    border-radius:11px;
}

main{
    max-width:1400px;
    margin:auto;
    padding:18px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:7px;
}

.subtitle{
    color:#9dafbf;
    margin-bottom:18px;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:#122536;
    border:1px solid #29455a;
    border-radius:15px;
    padding:16px;
}

.stat small{
    color:#9dafbf;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-top:7px;
}

.tables{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.table{
    background:#122536;
    border:1px solid #29455a;
    border-radius:16px;
    padding:14px;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.table-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.table-name{
    font-size:19px;
    font-weight:bold;
}

.badge{
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
}

.busy{
    background:#10a66a;
}

.free{
    background:#a82b48;
}

.table-info{
    color:#cbd8e2;
    line-height:1.8;
    font-size:13px;
}

.total{
    background:#087c54;
    padding:11px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.order-button{
    background:#1687ff;
    color:white;
    min-height:45px;
    border-radius:10px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.btn{
    padding:12px 15px;
    border-radius:10px;
}

.blue{
    background:#1687ff;
    color:white;
}

.yellow{
    background:#ffc83d;
    color:black;
}

.green{
    background:#16b875;
    color:white;
}

.red{
    background:#a82b48;
    color:white;
}

.dark{
    background:#193348;
    color:white;
}

.tandir-grid,
.menu-grid,
.history-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.card{
    background:#122536;
    border:1px solid #29455a;
    border-radius:16px;
    padding:17px;
}

.card h3{
    margin-bottom:10px;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0;
}

.number{
    background:#091722;
    padding:11px;
    border-radius:10px;
    text-align:center;
}

.number small{
    color:#9dafbf;
    display:block;
    font-size:11px;
}

.number b{
    font-size:18px;
}

.green-text{
    color:#50e0ad;
}

.yellow-text{
    color:#ffc83d;
}

.menu-grid{
    grid-template-columns:repeat(4,1fr);
}

.menu-item{
    background:#122536;
    border:1px solid #29455a;
    border-radius:15px;
    padding:15px;
}

.menu-emoji{
    font-size:30px;
}

.menu-item h3{
    margin:8px 0;
}

.price{
    color:#ffc83d;
    font-weight:bold;
}

.history-item{
    background:#122536;
    border:1px solid #29455a;
    border-radius:15px;
    padding:15px;
}

.bottom-menu{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#08131e;
    border-top:1px solid #29455a;
    display:flex;
    z-index:20;
}

.nav-btn{
    flex:1;
    background:transparent;
    color:#9dafbf;
    padding:8px 3px;
    font-size:11px;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:#ffc83d;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    z-index:100;
    padding:12px;
    overflow:auto;
}

.modal.show{
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:#0d1c29;
    border:1px solid #29455a;
    border-radius:20px;
    padding:18px;
    width:min(700px,100%);
    max-height:94vh;
    overflow:auto;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#193348;
    color:white;
    font-size:23px;
}

.section{
    background:#112536;
    border:1px solid #29455a;
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
}

.section h3{
    margin-bottom:12px;
}

.field{
    margin-bottom:11px;
}

.field label{
    display:block;
    color:#b9c7d2;
    font-size:13px;
    margin-bottom:6px;
}

.field input,
select{
    width:100%;
    height:48px;
    background:#081621;
    color:white;
    border:1px solid #35546b;
    border-radius:10px;
    padding:0 12px;
}

.save{
    width:100%;
    height:50px;
    background:#ffc83d;
    border-radius:11px;
    font-weight:bold;
}

.product-row{
    display:grid;
    grid-template-columns:1fr 120px 45px;
    gap:7px;
    margin-bottom:8px;
}

.product-row input{
    background:#081621;
    color:white;
    border:1px solid #35546b;
    border-radius:10px;
    padding:0 10px;
    min-height:45px;
}

.product-row button{
    background:#a82b48;
    color:white;
    border-radius:10px;
}

.add-product{
    width:100%;
    height:45px;
    background:#193b52;
    color:white;
    border-radius:10px;
}

.order-item{
    background:#132a3b;
    border:1px solid #29455a;
    border-radius:12px;
    padding:12px;
    margin-bottom:9px;
}

.order-top{
    display:flex;
    justify-content:space-between;
}

.order-price{
    color:#ffc83d;
    font-weight:bold;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.qty-btn{
    width:42px;
    height:42px;
    border-radius:9px;
    background:#203d52;
    color:white;
    font-size:20px;
}

.qty{
    min-width:40px;
    text-align:center;
    font-weight:bold;
}

.edit-btn{
    margin-left:auto;
    background:#294a61;
    color:white;
    padding:9px;
    border-radius:9px;
}

.big-total{
    background:#087c54;
    border-radius:13px;
    text-align:center;
    padding:15px;
    margin:12px 0;
}

.big-total small{
    display:block;
}

.big-total strong{
    font-size:27px;
}

.close-order{
    width:100%;
    height:52px;
    background:#16b875;
    color:white;
    border-radius:11px;
}

.empty{
    text-align:center;
    color:#9dafbf;
    padding:30px;
    border:1px dashed #29455a;
    border-radius:14px;
}

@media(max-width:1150px){
    .tables{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:850px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .tables{
        grid-template-columns:repeat(2,1fr);
    }

    .tandir-grid,
    .history-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .menu-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .logo h1{
        font-size:16px;
    }

    .logo p{
        display:none;
    }

    .tables{
        gap:8px;
    }

    .table{
        padding:10px;
    }

    .tandir-grid,
    .history-grid,
    .menu-grid{
        grid-template-columns:1fr;
    }

    .product-row{
        grid-template-columns:1fr 100px 42px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
    <div class="logo-icon">🥟</div>
    <div>
        <h1>ABDURAZZOQ SOMSA</h1>
        <p>Stol • Tandir • Menyu • Hisobot</p>
    </div>
</div>

<button class="settings-btn" onclick="openSettings()">
    ⚙️ Sozlamalar
</button>

</header>


<main>

<section id="home" class="page active"></section>

<section id="tablesPage" class="page"></section>

<section id="tandirPage" class="page"></section>

<section id="menuPage" class="page"></section>

<section id="reportPage" class="page"></section>

</main>


<nav class="bottom-menu">

<button class="nav-btn active" onclick="go('home',this)">
<span>🏠</span>
Asosiy
</button>

<button class="nav-btn" onclick="go('tablesPage',this)">
<span>🪑</span>
Stollar
</button>

<button class="nav-btn" onclick="go('tandirPage',this)">
<span>🔥</span>
Tandirlar
</button>

<button class="nav-btn" onclick="go('menuPage',this)">
<span>🍽️</span>
Menyu
</button>

<button class="nav-btn" onclick="go('reportPage',this)">
<span>📊</span>
Hisobot
</button>

</nav>


<!-- SOZLAMALAR -->

<div id="settingsModal" class="modal">

<div class="modal-box">

<div class="modal-head">
<h2>⚙️ Sozlamalar</h2>
<button class="close" onclick="closeModal('settingsModal')">×</button>
</div>


<div class="section">

<h3>🪑 Stol soni</h3>

<div class="field">

<label>Nechta stol bor?</label>

<input
id="tableCount"
type="number"
min="1"
max="100"
>

</div>

<button class="save" onclick="saveTableCount()">
💾 Stol sonini saqlash
</button>

</div>


<div class="section">

<h3>💰 Mahsulotlar va narxlar</h3>

<div id="productFields"></div>

<button class="add-product" onclick="addProductField()">
➕ Yangi mahsulot
</button>

<br><br>

<button class="save" onclick="saveProducts()">
💾 Narxlarni saqlash
</button>

</div>


<div class="section">

<h3>🗑️ Ma'lumotlarni tozalash</h3>

<button
class="btn red"
style="width:100%"
onclick="resetAll()">

Barcha ma'lumotlarni o‘chirish

</button>

</div>

</div>

</div>


<!-- STOL ZAKAZI -->

<div id="orderModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="orderTitle"></h2>

<button class="close" onclick="closeModal('orderModal')">
×
</button>

</div>


<div class="section">

<h3>➕ Zakaz qo‘shish</h3>

<div>

<select id="orderProduct"></select>

<br><br>

<input
id="orderQty"
type="number"
min="1"
value="1"
style="
width:100%;
height:48px;
background:#081621;
color:white;
border:1px solid #35546b;
border-radius:10px;
padding:0 12px;
">

<br><br>

<button
class="btn blue"
style="width:100%"
onclick="addOrder()">

➕ Zakaz qo‘shish

</button>

</div>

</div>


<div class="section">

<h3>📋 Stol zakazi</h3>

<div id="orderItems"></div>

<div class="big-total">

<small>Jami hisob</small>

<strong id="orderTotal">
0 so‘m
</strong>

</div>

<button
class="close-order"
onclick="closeOrder()">

✅ Hisobni yopish

</button>

</div>

</div>

</div>


<!-- YANGI TANDIR -->

<div id="tandirModal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2>🔥 Yangi tandir</h2>

<button class="close" onclick="closeModal('tandirModal')">
×
</button>

</div>


<div class="section">

<div class="field">

<label>
Mol go‘shtli somsa — nechta yopildi?
</label>

<input
id="beefBaked"
type="number"
min="0"
value="0"
>

</div>


<div class="field">

<label>
Qo‘y go‘shtli somsa — nechta yopildi?
</label>

<input
id="muttonBaked"
type="number"
min="0"
value="0"
>

</div>


<button
class="save"
onclick="createTandir()">

🔥 Tandirni ochish

</button>

</div>

</div>

</div>


<script>

const STORAGE_KEY="abdurazzoq_somsa_final";

const defaultProducts=[

{
id:1,
name:"Mol go‘shtli somsa",
price:10000,
type:"beef",
emoji:"🥟",
isSomsa:true
},

{
id:2,
name:"Qo‘y go‘shtli somsa",
price:10000,
type:"mutton",
emoji:"🥟",
isSomsa:true
},

{
id:3,
name:"Coca-Cola",
price:12000,
type:"drink",
emoji:"🥤",
isSomsa:false
},

{
id:4,
name:"Fanta",
price:12000,
type:"drink",
emoji:"🥤",
isSomsa:false
},

{
id:5,
name:"Choy",
price:5000,
type:"drink",
emoji:"🫖",
isSomsa:false
}

];


let data=loadData();

let currentTable=null;


function loadData(){

try{

let saved=localStorage.getItem(STORAGE_KEY);

if(saved){

return JSON.parse(saved);

}

}catch(e){}

return {

tableCount:20,

products:defaultProducts,

tables:{},

tandirs:[],

history:[]

};

}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function money(number){

return Number(number || 0)
.toLocaleString("uz-UZ")
.replace(/,/g," ")
+" so‘m";

}


function getTable(number){

if(!data.tables[number]){

data.tables[number]={
orders:[]
};

}

return data.tables[number];

}


function getTotal(number){

return getTable(number)
.orders
.reduce(
(sum,item)=>
sum+(item.price*item.qty),
0
);

}


function getSomsaCount(number){

return getTable(number)
.orders
.reduce(
(sum,item)=>
sum+(item.isSomsa?item.qty:0),
0
);

}


function activeTandir(){

return data.tandirs.find(
t=>t.status==="active"
);

}


function tandirRemaining(type){

let t=activeTandir();

if(!t)return 0;

return t[type+"Baked"]-
t[type+"Sold"];

}


function go(page,button){

document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);

document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll(".nav-btn")
.forEach(
b=>b.classList.remove("active")
);

if(button){

button.classList.add("active");

}

renderAll();

window.scrollTo(0,0);

}


function renderAll(){

renderHome();

renderTables();

renderTandir();

renderMenu();

renderReport();

}


function renderHome(){

let activeTables=
Object.keys(data.tables)
.filter(
key=>getTable(key).orders.length>0
).length;


let revenue=
data.history.reduce(
(sum,item)=>sum+item.total,
0
);


document.getElementById("home").innerHTML=`

<div class="title">
🏠 Abdurazzoq Somsa
</div>

<div class="subtitle">
Barcha ishlarni bitta joydan boshqaring.
</div>


<div class="stats">

<div class="stat">

<small>Band stollar</small>

<strong>
${activeTables}
</strong>

</div>


<div class="stat">

<small>Stollar jami</small>

<strong>
${data.tableCount}
</strong>

</div>


<div class="stat">

<small>Faol tandir</small>

<strong>
${activeTandir() ? "1 ta" : "Yo‘q"}
</strong>

</div>


<div class="stat">

<small>Jami tushum</small>

<strong>
${money(revenue)}
</strong>

</div>

</div>


<div class="toolbar">

<button
class="btn blue"
onclick="go('tablesPage',document.querySelectorAll('.nav-btn')[1])">

🪑 Stol zakazlari

</button>


<button
class="btn yellow"
onclick="openTandir()">

🔥 Yangi tandir

</button>


<button
class="btn dark"
onclick="go('menuPage',document.querySelectorAll('.nav-btn')[3])">

🍽️ Menyu

</button>

</div>


<div class="card">

<h3>⚡ Tezkor tizim</h3>

<p style="color:#9dafbf;line-height:1.7">

Stolga somsa zakazi kiritilganda faol tandirdagi
somsa avtomatik kamayadi.
Har bir stolning keyingi zakazi ustiga qo‘shiladi.
Tandirda nechta somsa yopilgani, sotilgani va qolgani
alohida ko‘rinadi.

</p>

</div>

`;

}


function renderTables(){

let html=`

<div class="title">
🪑 Stollar
</div>

<div class="subtitle">
Stolni bosing va zakazni tez kiriting.
</div>

<div class="tables">
`;


for(let i=1;i<=data.tableCount;i++){

let t=getTable(i);

let busy=t.orders.length>0;


html+=`

<div class="table"
onclick="openOrder(${i})">

<div class="table-head">

<div class="table-name">
${i}-stol
</div>

<span class="badge ${busy?"busy":"free"}">
${busy?"Band":"Bo‘sh"}
</span>

</div>


${
busy

?

`

<div class="table-info">

<div>
🥟 ${getSomsaCount(i)} ta somsa
</div>

<div>
📋 ${t.orders.length} xil mahsulot
</div>

</div>


<div class="total">
${money(getTotal(i))}
</div>

`

:

`

<div
style="
text-align:center;
padding:30px 0;
color:#9dafbf;
">

🪑<br>
Buyurtma yo‘q

</div>


<button
class="order-button"
onclick="
event.stopPropagation();
openOrder(${i})
">

+ Buyurtma

</button>

`

}

</div>

`;

}


html+=`

</div>
`;

document.getElementById("tablesPage").innerHTML=html;

}


function openOrder(number){

currentTable=number;

document.getElementById("orderTitle")
.textContent=`🪑 ${number}-stol`;

fillProducts();

renderOrder();

document
.getElementById("orderModal")
.classList.add("show");

}


function fillProducts(){

let select=
document.getElementById("orderProduct");

select.innerHTML="";


data.products.forEach(product=>{

let option=document.createElement("option");

option.value=product.id;

option.textContent=
`${product.emoji} ${product.name} — ${money(product.price)}`;

select.appendChild(option);

});

}


function renderOrder(){

let table=getTable(currentTable);

let box=
document.getElementById("orderItems");


if(table.orders.length===0){

box.innerHTML=`

<div class="empty">
Hali zakaz yo‘q.
</div>

`;

}else{

box.innerHTML=
table.orders.map(
(item,index)=>`

<div class="order-item">

<div class="order-top">

<div>
${item.emoji} ${item.name}
</div>

<div class="order-price">
${money(item.price*item.qty)}
</div>

</div>


<div class="controls">

<button
class="qty-btn"
onclick="changeQty(${index},-1)">

−

</button>


<div class="qty">
${item.qty}
</div>


<button
class="qty-btn"
onclick="changeQty(${index},1)">

+

</button>


<button
class="edit-btn"
onclick="editQty(${index})">

✏️ Tahrirlash

</button>

</div>

</div>

`
).join("");

}


document.getElementById("orderTotal")
.textContent=
money(getTotal(currentTable));

}


function addOrder(){

let productId=
Number(
document.getElementById("orderProduct").value
);

let quantity=
Math.floor(
Number(
document.getElementById("orderQty").value
)
);


let product=
data.products.find(
p=>p.id===productId
);


if(!product || quantity<1){

alert("Miqdorni to‘g‘ri kiriting.");

return;

}


if(product.isSomsa){

let tandir=activeTandir();

if(!tandir){

alert(
"Avval 🔥 Tandirlar bo‘limidan yangi tandir oching."
);

return;

}


let remaining=
tandirRemaining(product.type);


if(quantity>remaining){

alert(
`Bu tandirda faqat ${remaining} ta qoldi.`
);

return;

}

}


let table=
getTable(currentTable);


let existing=
table.orders.find(
item=>item.productId===product.id
);


if(existing){

existing.qty+=quantity;

}else{

table.orders.push({

productId:product.id,

name:product.name,

price:product.price,

qty:quantity,

type:product.type,

isSomsa:product.isSomsa,

emoji:product.emoji

});

}


if(product.isSomsa){

let tandir=activeTandir();

tandir[product.type+"Sold"]+=quantity;

}


saveData();

renderOrder();

renderAll();

document.getElementById("orderQty").value=1;

}


function changeQty(index,difference){

let table=
getTable(currentTable);

let item=
table.orders[index];


if(difference>0 && item.isSomsa){

let tandir=activeTandir();

if(!tandir){

alert("Faol tandir yo‘q.");

return;

}


if(tandirRemaining(item.type)<1){

alert("Bu somsadan tandirda qolmagan.");

return;

}


tandir[item.type+"Sold"]++;

}


if(difference<0 && item.isSomsa){

let tandir=activeTandir();

if(tandir){

tandir[item.type+"Sold"]=
Math.max(
0,
tandir[item.type+"Sold"]-1
);

}

}


item.qty+=difference;


if(item.qty<=0){

table.orders.splice(index,1);

}


saveData();

renderOrder();

renderAll();

}


function editQty(index){

let table=
getTable(currentTable);

let item=
table.orders[index];


let newQty=
Number(
prompt(
`${item.name} nechta bo‘lsin?`,
item.qty
)
);


if(!Number.isInteger(newQty)||newQty<1){

return;

}


let difference=
newQty-item.qty;


if(item.isSomsa){

let tandir=activeTandir();

if(!tandir){

alert("Faol tandir yo‘q.");

return;

}


if(
difference>0 &&
tandirRemaining(item.type)<difference
){

alert(
`Faqat ${tandirRemaining(item.type)} ta qolgan.`
);

return;

}


tandir[item.type+"Sold"]+=difference;

}


item.qty=newQty;

saveData();

renderOrder();

renderAll();

}


function closeOrder(){

let table=
getTable(currentTable);


if(table.orders.length===0){

closeModal("orderModal");

return;

}


let total=
getTotal(currentTable);


let answer=
confirm(
`${currentTable}-stol hisobini yopamizmi?\n\nJami: ${money(total)}`
);


if(!answer)return;


data.history.push({

table:currentTable,

total:total,

orders:
JSON.parse(
JSON.stringify(table.orders)
),

date:
new Date().toISOString()

});


table.orders=[];

saveData();

closeModal("orderModal");

renderAll();

}

}else{

if(history.length===0){

class="empty"
style="grid-column:1/-1">

history.forEach(t=>{

t.beefBaked+

t.muttonSold;

baked-sold;

function openTandir(){

if(activeTandir()){

alert(
"Avval hozirgi tandirni tugating."
);

return;

}


document.getElementById("beefBaked").value=0;

document.getElementById("muttonBaked").value=0;

document
.getElementById("tandirModal")
.classList.add("show");

}


function createTandir(){

let beef=
Math.floor(
Number(
document.getElementById("beefBaked").value
)
);

let mutton=
Math.floor(
Number(
document.getElementById("muttonBaked").value
)
);


if(beef+mutton<1){

alert(
"Kamida bitta somsa sonini kiriting."
);

return;

}


data.tandirs.push({

id:Date.now(),

name:
`${data.tandirs.length+1}-tandir`,

beefBaked:beef,

muttonBaked:mutton,

beefSold:0,

muttonSold:0,

status:"active",

openedAt:
new Date().toISOString()

});


saveData();

closeModal("tandirModal");

renderAll();

}


function finishTandir(){

let tandir=activeTandir();

if(!tandir)return;


let answer=
confirm(
`${tandir.name}ni tugatasizmi?`
);


if(!answer)return;


tandir.status="closed";

tandir.closedAt=
new Date().toISOString();


saveData();

renderAll();

}

function openSettings(){

document.getElementById("tableCount").value=
data.tableCount;

renderProductFields();

document
.getElementById("settingsModal")
.classList.add("show");

}


function renderProductFields(){

document.getElementById("productFields")
.innerHTML=

data.products.map(
(p,index)=>`

<div class="product-row">

<input
class="product-name"
data-index="${index}"
value="${p.name}"
>

<input
class="product-price"
data-index="${index}"
type="number"
value="${p.price}"
>

<button
onclick="deleteProduct(${index})">

×

</button>

</div>

`
).join("");

}


function addProductField(){

data.products.push({

id:Date.now(),

name:"Yangi mahsulot",

price:0,

type:"other",

emoji:"🍽️",

isSomsa:false

});


renderProductFields();

}


function deleteProduct(index){

if(data.products.length<=1){

alert(
"Kamida bitta mahsulot qolishi kerak."
);

return;

}


data.products.splice(index,1);

renderProductFields();

}


function saveProducts(){

let names=
document.querySelectorAll(".product-name");

let prices=
document.querySelectorAll(".product-price");


names.forEach(
(input,index)=>{

data.products[index].name=
input.value.trim() ||
"Mahsulot";

data.products[index].price=
Number(prices[index].value)||0;

}
);


saveData();

closeModal("settingsModal");

renderAll();

}


function saveTableCount(){

let count=
Math.floor(
Number(
document.getElementById("tableCount").value
)
);


if(count<1||count>100){

alert(
"Stol soni 1 dan 100 gacha bo‘lishi kerak."
);

return;

}


data.tableCount=count;

saveData();

closeModal("settingsModal");

renderAll();

}


function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}


function resetAll(){

let answer=
confirm(
"Barcha ma'lumotlar o‘chiriladi. Davom etasizmi?"
);


if(!answer)return;


localStorage.removeItem(STORAGE_KEY);

location.reload();

}


renderAll();
